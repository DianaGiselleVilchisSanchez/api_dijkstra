<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Visualización de Grafo</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="container">
    <h1>Visualización del Grafo</h1>
    <div id="graph"></div>
  </div>

  <script src="/static/d3.min.js"></script>
  <script>
    const edges = [
      { source: 'A', target: 'B', weight: 3 },
      { source: 'A', target: 'C', weight: 1 },
      { source: 'B', target: 'D', weight: 2 },
      { source: 'C', target: 'D', weight: 4 }
    ];

    const ruta = ['A', 'B', 'D'];  // Ruta de ejemplo

    const nodesSet = new Set();
    edges.forEach(e => {
      nodesSet.add(e.source);
      nodesSet.add(e.target);
    });

    const nodes = Array.from(nodesSet).map(id => ({ id }));

    const svg = d3.select("#graph").append("svg")
      .attr("width", "100%")
      .attr("height", 400);

    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(edges).id(d => d.id).distance(100))
      .force("charge", d3.forceManyBody().strength(-300))
      .force("center", d3.forceCenter(450, 200));

    const link = svg.selectAll("line")
      .data(edges)
      .enter().append("line")
      .attr("stroke", d => ruta.includes(d.source) && ruta.includes(d.target) ? "#f00" : "#999")
      .attr("stroke-width", 2);

    const node = svg.selectAll("circle")
      .data(nodes)
      .enter().append("circle")
      .attr("r", 18)
      .attr("fill", d => ruta.includes(d.id) ? "#4caf50" : "#2196f3")
      .call(d3.drag()
        .on("start", dragstart)
        .on("drag", dragged)
        .on("end", dragend));

    const labels = svg.selectAll("text")
      .data(nodes)
      .enter().append("text")
      .text(d => d.id)
      .attr("text-anchor", "middle")
      .attr("dy", ".35em")
      .attr("fill", "#fff");

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);

      node
        .attr("cx", d => d.x).attr("cy", d => d.y);

      labels
        .attr("x", d => d.x).attr("y", d => d.y);
    });

    function dragstart(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x; d.fy = event.y;
    }

    function dragend(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null; d.fy = null;
    }
  </script>
</body>
</html>
